<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f0e" />
    <meta name="apple-mobile-web-app-title" content="NØNE" />
    <meta
      name="description"
      content="Anonymer Zufallschat ab 18. Alle sind mit Ausweis verifiziert, im Chat sieht man davon nur ein Siegel."
    />
    <title>NØNE – Identität spielt keine Rolle</title>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NØNE – Identität spielt keine Rolle" />
    <meta
      property="og:description"
      content="Anonymer Zufallschat ab 18. Alle sind mit Ausweis verifiziert, im Chat sieht man davon nur ein Siegel."
    />
    <meta property="og:url" content="https://none-chat.ch/" />
    <meta property="og:site_name" content="NØNE" />
    <meta property="og:locale" content="de_CH" />
    <!-- Vorschaubild zum Teilen, erzeugt mit scripts/og/erzeugen.mjs. Absolute
         Adresse: WhatsApp, X & Co. laden es von aussen. -->
    <meta property="og:image" content="https://none-chat.ch/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NØNE – Anonym chatten. Mit echten Menschen. Verifiziert ab 18." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://none-chat.ch/og.jpg" />

    <!--
      Die Darstellung wird gesetzt, bevor React lädt. Ohne diese Zeilen blitzt
      beim Neuladen kurz die helle Ansicht auf, wenn jemand dunkel gewählt hat –
      der Zustand steht im Speicher, aber gelesen wird er erst später.
      Fehlschläge sind egal: Dann greift wieder die Systemvorgabe.
    -->
    <script>
      try {
        var wahl = localStorage.getItem('vac.v1.theme')
        if (wahl === 'dark' || wahl === 'light') document.documentElement.setAttribute('data-theme', wahl)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
