name: Discord einrichten

# Legt in den drei Discord-Kanälen (Meldungen, Support, Log) je einen
# Webhook an und hinterlegt die Adressen im Google Secret Manager. Danach
# startet "Firebase Functions" von selbst und rollt die Benachrichtigungen
# aus.
#
# Nur von Hand gestartet (Actions → Discord einrichten → Run workflow).
# Beliebig oft startbar. Die Kanäle selbst fasst er nicht an.
#
# Voraussetzungen, siehe docs/discord.md:
#   - Secret DISCORD_BOT_TOKEN
#   - Secret DISCORD_KANAL_LOG        (Kanal-ID des Log-Kanals)
#   - Secret FIREBASE_SERVICE_ACCOUNT (wie beim Regel-Ablauf)
#   - Google-Cloud-Dienst Secret Manager eingeschaltet
#
# Die Kanal-IDs sind kein Geheimnis – ohne Zugang zum Server nützen sie
# nichts. Wer die Kanäle neu anlegt, trägt hier die neuen IDs ein.
#
# Die Webhook-Adressen erscheinen nirgends im Protokoll und liegen nie im
# Repository oder in GitHub – nur im Secret Manager.
on:
  workflow_dispatch:

jobs:
  einrichten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Webhooks anlegen
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_KANAL_MELDUNGEN: '1552305430670217327'
          DISCORD_KANAL_SUPPORT: '1552305324583551056'
          DISCORD_KANAL_LOG: ${{ secrets.DISCORD_KANAL_LOG }}
        run: node scripts/discord-einrichten.mjs

      - name: Schlüssel bereitstellen
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt. Anleitung: docs/deployment.md"
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Webhooks in den Secret Manager
        id: geheimnisse
        run: |
          npx --yes firebase-tools@15 functions:secrets:set DISCORD_WEBHOOK_MELDUNGEN \
            --data-file "$RUNNER_TEMP/discord-meldungen.url" --force --project anonym-chat-223af --non-interactive
          npx --yes firebase-tools@15 functions:secrets:set DISCORD_WEBHOOK_SUPPORT \
            --data-file "$RUNNER_TEMP/discord-support.url" --force --project anonym-chat-223af --non-interactive
          npx --yes firebase-tools@15 functions:secrets:set DISCORD_WEBHOOK_LOG \
            --data-file "$RUNNER_TEMP/discord-log.url" --force --project anonym-chat-223af --non-interactive

      # Nur wenn wirklich der Secret Manager gescheitert ist.
      - name: Hinweis bei fehlenden Rechten im Secret Manager
        if: failure() && steps.geheimnisse.outcome == 'failure'
        run: |
          echo "::error::Secret Manager verweigert den Zugriff. Dem Dienstkonto fehlt die Rolle 'Secret Manager Admin' (Google-Cloud-Konsole → IAM) – siehe docs/discord.md, Schritt 1."

      - name: Aufräumen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json" "$RUNNER_TEMP"/discord-*.url
