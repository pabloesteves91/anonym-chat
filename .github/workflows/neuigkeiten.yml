name: Neuigkeiten einspielen

# Legt die Einträge aus scripts/neuigkeiten-start.json in den Neuigkeiten an.
# Läuft, wenn sich die Liste ändert, oder von Hand. Bestehende Einträge
# bleiben unangetastet – bearbeitet und gelöscht wird in der Verwaltung.
#
# Voraussetzung: Secret FIREBASE_SERVICE_ACCOUNT (wie beim Regel-Ablauf).
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/neuigkeiten-start.json
      - scripts/neuigkeiten-einspielen.mjs
      - .github/workflows/neuigkeiten.yml

jobs:
  einspielen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Pakete der Funktionen
        run: npm ci --prefix functions

      - name: Schlüssel bereitstellen
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt. Anleitung: docs/deployment.md"
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Einspielen
        run: node scripts/neuigkeiten-einspielen.mjs

      - name: Aufräumen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
