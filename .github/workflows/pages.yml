name: Pages

# Die App läuft auf Firebase Hosting unter https://none-chat.ch (siehe
# firebase-hosting.yml). GitHub Pages leitet nur noch dorthin um, damit alte
# Links auf …github.io/anonym-chat/ weiter funktionieren – auch solche mit
# #/chat, die zu /chat werden.
on:
  push:
    branches:
      - main
      - claude/busy-galileo-ovdxll
    paths:
      - weiterleitung/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dieselbe Seite für jeden Pfad: 404.html fängt …/anonym-chat/chat ab.
      - run: |
          mkdir -p _site
          cp weiterleitung/index.html _site/index.html
          cp weiterleitung/index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
