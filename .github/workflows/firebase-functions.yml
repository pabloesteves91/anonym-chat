name: Firebase Functions

# Rollt die Funktionen aus, ohne dass jemand ein Terminal braucht: die Kasse
# (Stripe) und die Benachrichtigungen an Discord.
#
# Voraussetzungen:
#   - Firebase auf Blaze (Cloud Functions gibt es im Gratistarif nicht)
#   - Secret FIREBASE_SERVICE_ACCOUNT (wie beim Regel-Ablauf)
#
# Freiwillig – was fehlt, bekommt einen Platzhalter und bleibt still:
#   - Secret STRIPE_SECRET_KEY        (beginnt mit sk_)
#   - Secret STRIPE_WEBHOOK_SECRET    (beginnt mit whsec_, kommt später)
#   - DISCORD_WEBHOOK_MELDUNGEN / _SUPPORT / _LOG setzt der Ablauf "Discord
#     einrichten" direkt im Secret Manager; nach ihm startet dieser hier.
#
# Ein Platzhalter wird nur gesetzt, wenn im Secret Manager noch gar nichts
# steht. Was dort schon liegt – auch von Hand eingetragen –, bleibt.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Discord einrichten']
    types: [completed]
  push:
    paths:
      - functions/**
      - .github/workflows/firebase-functions.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nach "Discord einrichten" nur, wenn das Einrichten geklappt hat.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typprüfung der Funktionen
        run: |
          npm --prefix functions ci
          npm --prefix functions run lint

      - name: Schlüssel bereitstellen
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt. Anleitung: docs/deployment.md"
            exit 1
          fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Geheimnisse im Secret Manager
        id: geheimnisse
        env:
          SK: ${{ secrets.STRIPE_SECRET_KEY }}
          WH: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          FB="npx --yes firebase-tools@15"
          P="--project anonym-chat-223af --non-interactive"

          setzen() { printf '%s' "$2" | $FB functions:secrets:set "$1" --data-file - --force $P; }
          # Nur wenn noch nichts da ist. `get` listet Versionen, nie den Wert.
          platzhalter() {
            if $FB functions:secrets:get "$1" $P > /dev/null 2>&1; then
              echo "$1 ist gesetzt."
            else
              echo "::notice::$1 fehlt – Platzhalter gesetzt. $3"
              setzen "$1" "$2"
            fi
          }

          if [ -n "$SK" ]; then setzen STRIPE_SECRET_KEY "$SK"
          else platzhalter STRIPE_SECRET_KEY sk_NOCH_NICHT_GESETZT "Die Kasse bleibt aus. Anleitung: docs/tarife.md"; fi

          if [ -n "$WH" ]; then setzen STRIPE_WEBHOOK_SECRET "$WH"
          else platzhalter STRIPE_WEBHOOK_SECRET whsec_NOCH_NICHT_GESETZT "Die Kasse nimmt keine Quittungen an. Anleitung: docs/tarife.md"; fi

          platzhalter DISCORD_WEBHOOK_MELDUNGEN nicht-eingerichtet "Keine Discord-Benachrichtigungen. Anleitung: docs/discord.md"
          platzhalter DISCORD_WEBHOOK_SUPPORT nicht-eingerichtet "Keine Discord-Benachrichtigungen. Anleitung: docs/discord.md"
          platzhalter DISCORD_WEBHOOK_LOG nicht-eingerichtet "Kein Protokoll auf Discord. Anleitung: docs/discord.md"

      # Nur wenn wirklich der Secret Manager gescheitert ist.
      - name: Hinweis bei fehlenden Rechten im Secret Manager
        if: failure() && steps.geheimnisse.outcome == 'failure'
        run: |
          echo "::error::Secret Manager verweigert den Zugriff. Dem Dienstkonto fehlt die Rolle 'Secret Manager Admin' (Google-Cloud-Konsole → IAM) – siehe docs/discord.md, Schritt 1."

      - name: Funktionen ausrollen
        id: ausrollen
        # --force: setzt die Aufräumregel für alte Build-Abbilder (sonst
        # sammeln sie sich an und kosten monatlich) und würde Funktionen
        # löschen, die nicht mehr im Code stehen – alle stehen dort.
        run: npx --yes firebase-tools@15 deploy --only functions --project anonym-chat-223af --non-interactive --force

      # Nur wenn wirklich das Ausrollen gescheitert ist. Ein fehlendes
      # Secret hat nichts mit Rollen zu tun, und ein falscher Hinweis
      # schickt auf die falsche Fährte.
      - name: Hinweis bei fehlenden Rechten
        if: failure() && steps.ausrollen.outcome == 'failure'
        run: |
          echo "::error::Ausrollen fehlgeschlagen. Fehlen dem Dienstkonto Rollen, nennt die Meldung oben welche – siehe docs/tarife.md, Abschnitt 'Wenn das Ausrollen an Rechten scheitert'."

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
