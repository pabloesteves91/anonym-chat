<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Montserrat'; src: url('../../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Plex Mono'; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background:
      radial-gradient(620px 420px at 86% 44%, rgba(78,196,176,.20), transparent 70%),
      radial-gradient(900px 500px at 10% 110%, rgba(78,196,176,.07), transparent 70%),
      #0b0f0e;
    color: #e8edeb; font-family: 'Montserrat', sans-serif;
  }
  /* feines Raster, kaum sichtbar */
  body::before { content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(232,237,235,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(232,237,235,.035) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(900px 600px at 70% 50%, #000 30%, transparent 80%); }
  .links { position: absolute; left: 80px; top: 128px; width: 620px; }
  .logo { height: 58px; display: block; }
  h1 { margin-top: 44px; font-size: 52px; white-space: nowrap; line-height: 1.08; font-weight: 650; letter-spacing: -0.5px; }
  h1 span { color: #4ec4b0; }
  .unter { margin-top: 30px; font-size: 24px; line-height: 1.45; color: #a9b8b3; font-weight: 450; }
  .fuss { position: absolute; left: 80px; bottom: 64px; font-family: 'Plex Mono', monospace; font-size: 22px; color: #6fd6c3; letter-spacing: .5px; display: flex; align-items: center; gap: 12px; }
  .fuss svg { width: 26px; height: 26px; }
  /* Chat-Blasen, gesichtslos */
  .blase { position: absolute; border-radius: 26px; backdrop-filter: blur(6px); }
  .b1 { right: 250px; top: 150px; width: 250px; height: 92px; background: rgba(28,36,34,.92); border: 1.5px solid rgba(232,237,235,.12); border-bottom-left-radius: 8px; }
  .b2 { right: 80px; top: 270px; width: 270px; height: 92px; background: #4ec4b0; border-bottom-right-radius: 8px; box-shadow: 0 20px 60px -20px rgba(78,196,176,.6); }
  .b3 { right: 230px; top: 392px; width: 190px; height: 70px; background: rgba(28,36,34,.92); border: 1.5px solid rgba(232,237,235,.12); border-bottom-left-radius: 8px; }
  .zeile { position: absolute; height: 12px; border-radius: 6px; }
  .b1 .zeile, .b3 .zeile { background: rgba(232,237,235,.22); }
  .b2 .zeile { background: rgba(8,32,28,.45); }
  .siegel { position: absolute; right: 118px; top: 118px; width: 86px; height: 86px; border-radius: 50%;
    background: #12302a; border: 2px solid rgba(78,196,176,.55); display: grid; place-items: center;
    box-shadow: 0 0 0 10px rgba(78,196,176,.06), 0 0 60px rgba(78,196,176,.35); }
  .siegel svg { width: 46px; height: 46px; color: #6fd6c3; }
</style>
</head>
<body>
  <div class="links">
    <img class="logo" src="../../src/assets/logo-text.png" alt="">
    <h1>Anonym chatten.<br><span>Mit echten Menschen.</span></h1>
    <p class="unter">Jede Person ist verifiziert – im Gespräch siehst du nur einen Zufallsnamen.</p>
  </div>
  <div class="fuss">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l7 2.6v5.2c0 4.2-2.8 7.4-7 9.2-4.2-1.8-7-5-7-9.2V5.6L12 3z" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.8 12.2l2.3 2.3 4.1-4.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Verifiziert ab 18 · none-chat.ch
  </div>

  <div class="blase b1"><div class="zeile" style="left:28px;top:30px;width:170px"></div><div class="zeile" style="left:28px;top:52px;width:110px"></div></div>
  <div class="blase b2"><div class="zeile" style="left:28px;top:30px;width:200px"></div><div class="zeile" style="left:28px;top:52px;width:140px"></div></div>
  <div class="blase b3"><div class="zeile" style="left:26px;top:29px;width:120px"></div></div>
  <div class="siegel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l7 2.6v5.2c0 4.2-2.8 7.4-7 9.2-4.2-1.8-7-5-7-9.2V5.6L12 3z" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.8 12.2l2.3 2.3 4.1-4.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</body>
</html>
